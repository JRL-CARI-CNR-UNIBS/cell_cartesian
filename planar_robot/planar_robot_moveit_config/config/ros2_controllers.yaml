# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    planar_robot_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

planar_robot_controller:
  ros__parameters:
    joints:
      - joint_X
      - joint_Y
    command_interfaces:
      - position
      #- velocity
    state_interfaces:
      - position
      - velocity